<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สภาพอากาศ 77 จังหวัด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>
  // ใช้ธีมที่ผู้ชมเลือกไว้ครั้งก่อน (ค่าเริ่มต้น: มืด)
  try { const t = localStorage.getItem("wx-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root, :root[data-theme="dark"] {
    --page: #101012; --app: #19191b; --card: #232326; --tile: #2d2d31; --tile-hover: #36363b;
    --text: #f4f4f5; --muted: #a1a1aa; --line: #34343a; --accent: #fbbf24; --accent-text: #19191b;
    --blue: #60a5fa; --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  }
  :root[data-theme="light"] {
    --page: #e9edf2; --app: #f5f7fa; --card: #ffffff; --tile: #f1f4f8; --tile-hover: #e7ecf3;
    --text: #18202b; --muted: #637083; --line: #e2e7ee; --accent: #f59e0b; --accent-text: #ffffff;
    --blue: #2563eb; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--text); font-family: Inter, Sarabun, system-ui, sans-serif; font-size: 15px; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 1440px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 20px; padding: 20px; background: var(--app); }

  /* แถบเมนูซ้าย */
  .nav { position: sticky; top: 20px; height: calc(100vh - 40px); background: var(--card); border-radius: 22px; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; box-shadow: var(--shadow); }
  .nav .logo { width: 40px; height: 40px; margin-bottom: 14px; }
  .nav a { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); text-decoration: none; position: relative; }
  .nav a:hover { background: var(--tile); color: var(--text); }
  .nav a.on { background: var(--tile); color: var(--text); }
  .nav a.on::before { content: ""; position: absolute; left: -15px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent); }
  .nav svg { width: 21px; height: 21px; }
  .nav .spacer { flex: 1; }

  /* ส่วนหัว */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .hello { flex: 1 1 260px; min-width: 0; }
  .hello .hi { color: var(--muted); font-size: 14px; }
  .hello h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; }
  .search { position: relative; flex: 0 1 340px; min-width: 200px; }
  .search input { width: 100%; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); padding: 0 16px 0 42px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search > svg { position: absolute; left: 15px; top: 13px; width: 18px; height: 18px; color: var(--muted); }
  .sugg { position: absolute; z-index: 1000; top: 50px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; display: none; max-height: 320px; overflow: auto; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .sugg.show { display: block; }
  .sugg button { display: flex; width: 100%; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; text-align: left; }
  .sugg button:hover, .sugg button.hl { background: var(--tile); }
  .sugg small { color: var(--muted); }
  .toggles { display: flex; gap: 10px; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 3px; }
  .seg button { white-space: nowrap; border: 0; background: none; height: 36px; min-width: 38px; padding: 0 10px; border-radius: 18px; cursor: pointer; color: var(--muted); display: grid; place-items: center; font-weight: 600; }
  .seg button.on { background: var(--tile-hover); color: var(--text); }
  .seg svg { width: 18px; height: 18px; }

  /* การ์ด */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 20px; }
  .card { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { font-size: 17px; margin: 0; font-weight: 700; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
  .full { grid-column: 1 / -1; }

  /* การ์ดสภาพอากาศหลัก */
  .now { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 4px 12px; min-height: 270px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--tile); border-radius: 12px; padding: 7px 12px; font-size: 13px; width: max-content; max-width: 100%; }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .now .rain { justify-self: end; align-self: start; background: var(--tile); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--blue); font-weight: 600; }
  .now .day { font-size: 30px; font-weight: 700; margin-top: 12px; line-height: 1.1; }
  .now .date { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .now .big-ic { width: 150px; height: 150px; margin: 6px 0 0 -6px; }
  .now .right { text-align: right; align-self: center; }
  .now .temp { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -1px; }
  .now .minmax { color: var(--muted); font-size: 20px; margin-top: 6px; }
  .now .desc { text-align: right; align-self: end; }
  .now .desc b { display: block; font-size: 17px; }
  .now .desc span { color: var(--muted); font-size: 13px; }
  .now .left-bottom { align-self: end; }

  /* ไฮไลต์วันนี้ */
  .hl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.3fr); grid-template-rows: auto auto; gap: 12px; }
  .tile { background: var(--tile); border-radius: 16px; padding: 14px; min-width: 0; }
  .tile .k { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .tile .k svg { width: 17px; height: 17px; color: var(--text); flex: none; }
  .tile .v { font-size: 26px; font-weight: 700; margin-top: 12px; display: flex; align-items: baseline; gap: 5px; justify-content: center; }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .tile .s { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tile .wind-arrow { width: 18px; height: 18px; color: var(--blue); align-self: center; transition: transform .4s; }
  .sun { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .sun svg { width: 58px; height: 58px; flex: none; }
  .sun .k { justify-content: flex-start; }
  .sun .v { margin-top: 2px; justify-content: flex-start; font-size: 24px; }
  .sun-rise { grid-column: 3; grid-row: 1; } .sun-set { grid-column: 3; grid-row: 2; }

  /* รายการจังหวัด */
  .ctrl { display: flex; gap: 8px; }
  .ctrl select { background: var(--tile); border: 0; border-radius: 10px; padding: 6px 8px; font-size: 13px; cursor: pointer; }
  .plist { display: flex; flex-direction: column; gap: 10px; max-height: 330px; overflow: auto; padding-right: 4px; }
  .pitem { display: grid; grid-template-columns: minmax(0, 1fr) 54px 92px; align-items: center; gap: 10px; background: var(--tile); border: 1px solid transparent; border-radius: 16px; padding: 12px 14px; cursor: pointer; text-align: left; }
  .pitem:hover { background: var(--tile-hover); }
  .pitem.on { border-color: var(--accent); }
  .pitem .rg { font-size: 11px; color: var(--muted); }
  .pitem .nm { font-size: 17px; font-weight: 600; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .ds { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem svg { width: 50px; height: 50px; }
  .pitem .tp { text-align: right; font-size: 20px; font-weight: 700; }
  .pitem .tp small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .link { border: 0; background: none; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }

  /* พยากรณ์ 10 วัน */
  .days { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .dcard { flex: 0 0 auto; width: 84px; background: var(--tile); border-radius: 40px; padding: 14px 6px 16px; text-align: center; scroll-snap-align: start; }
  .dcard.today { background: var(--accent); color: var(--accent-text); }
  .dcard.today .rp, .dcard.today .mn { color: inherit; opacity: .85; }
  .dcard .dn { font-size: 13px; font-weight: 600; }
  .dcard .dd { font-size: 11px; opacity: .75; }
  .dcard .bar { width: 26px; height: 2px; border-radius: 2px; background: currentColor; opacity: .25; margin: 8px auto; }
  .dcard svg { width: 52px; height: 52px; }
  .dcard .mx { font-weight: 700; font-size: 16px; margin-top: 4px; }
  .dcard .mn { color: var(--muted); font-size: 13px; }
  .dcard .rp { color: var(--blue); font-size: 12px; margin-top: 6px; font-weight: 600; }

  /* แผนที่ */
  #map { height: 520px; border-radius: 16px; background: var(--tile); z-index: 0; }
  .leaflet-container { font: inherit; }
  .legend { background: var(--card); color: var(--text); padding: 8px 10px; border-radius: 12px; font-size: 12px; line-height: 1.6; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .leaflet-tooltip { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .leaflet-tooltip-top:before { border-top-color: var(--card); }

  /* ตาราง */
  .tbl-wrap { overflow: auto; max-height: 560px; border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--tile); }
  tbody tr.on { background: var(--tile-hover); }
  td .ic { width: 26px; height: 26px; vertical-align: middle; margin-right: 6px; }
  .badge { display: inline-block; min-width: 46px; padding: 2px 7px; border-radius: 8px; color: #fff; font-weight: 700; text-align: center; }
  .tbl-ctrl input { background: var(--tile); border: 0; border-radius: 10px; padding: 7px 10px; font-size: 13px; width: 180px; outline: none; }

  footer { color: var(--muted); font-size: 12px; margin-top: 20px; line-height: 1.7; }
  footer a { color: var(--text); }
  .msg { color: var(--muted); padding: 30px 10px; text-align: center; }

  @media (max-width: 1180px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 92px; gap: 0; }
    .nav { position: fixed; z-index: 1001; top: auto; bottom: 12px; left: 16px; right: 16px; height: 64px; flex-direction: row; justify-content: space-around; padding: 0 8px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .nav .logo, .nav .spacer { display: none; }
    .nav a.on::before { left: 12px; right: 12px; top: auto; bottom: -9px; width: auto; height: 3px; }
    .search { flex: 1 1 100%; order: 3; }
    .card { padding: 16px; border-radius: 20px; }
    .grid { gap: 16px; }
    .now { grid-template-columns: 1fr auto; min-height: 0; }
    .now .big-ic { width: 110px; height: 110px; }
    .now .temp { font-size: 42px; }
    .hl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sun-rise, .sun-set { grid-column: auto; grid-row: auto; }
    .sun { flex-direction: column; gap: 4px; text-align: center; }
    .sun svg { width: 40px; height: 40px; }
    .sun .k { justify-content: center; }
    .sun .v { font-size: 20px; justify-content: center; }
    .card-head { flex-wrap: wrap; }
    td .wxt { display: none; }
    .sun-rise { order: 5; } .sun-set { order: 6; }
    th, td { padding: 9px 6px; font-size: 13px; }
    .badge { min-width: 40px; padding: 2px 5px; }
    #map { height: 420px; }
    .hide-sm { display: none; }
    .tbl-ctrl input { width: 130px; }
  }
</style>
</head>
<body>
<!-- gradient ใช้ร่วมกันสำหรับไอคอนสภาพอากาศทุกตัว -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gSun" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3a3"/><stop offset=".55" stop-color="#fcc419"/><stop offset="1" stop-color="#f59f00"/></radialGradient>
    <radialGradient id="gMoon" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#e9c46a"/></radialGradient>
    <linearGradient id="gCloud" x1="0" y1="14" x2="0" y2="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d0dc"/></linearGradient>
    <linearGradient id="gCloudDark" x1="0" y1="14" x2="0" y2="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d5dbe4"/><stop offset="1" stop-color="#8994a6"/></linearGradient>
    <linearGradient id="gCloudBack" x1="0" y1="8" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b9c2cf"/><stop offset="1" stop-color="#8590a1"/></linearGradient>
    <linearGradient id="gDrop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2f80ed"/></linearGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f59f00"/></linearGradient>
    <filter id="fSoft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
</svg>

<div class="app">
  <nav class="nav" aria-label="เมนู">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#ic-logo"/></svg>
    <a href="#overview" class="on" title="ภาพรวม" aria-label="ภาพรวม"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></a>
    <a href="#forecast" title="พยากรณ์ 10 วัน" aria-label="พยากรณ์ 10 วัน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></a>
    <a href="#mapcard" title="แผนที่" aria-label="แผนที่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></a>
    <a href="#tablecard" title="ตาราง 77 จังหวัด" aria-label="ตาราง 77 จังหวัด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a>
    <div class="spacer"></div>
    <a href="#about" title="เกี่ยวกับข้อมูล" aria-label="เกี่ยวกับข้อมูล"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></a>
  </nav>

  <main>
    <div class="top" id="overview">
      <div class="hello">
        <div class="hi" id="greet">สวัสดี</div>
        <h1>สภาพอากาศ 77 จังหวัด</h1>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ค้นหาจังหวัด…" autocomplete="off" aria-label="ค้นหาจังหวัด">
        <div class="sugg" id="sugg" role="listbox"></div>
      </div>
      <div class="toggles">
        <div class="seg" role="group" aria-label="หน่วยอุณหภูมิ">
          <button data-unit="C" class="on">°C</button><button data-unit="F">°F</button>
        </div>
        <div class="seg" role="group" aria-label="ธีม">
          <button data-theme-btn="light" title="โหมดสว่าง" aria-label="โหมดสว่าง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button data-theme-btn="dark" title="โหมดมืด" aria-label="โหมดมืด"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="grid">
      <section class="card now" id="nowcard"><div class="msg">กำลังโหลดข้อมูล…</div></section>

      <section class="card">
        <div class="card-head"><h2>ไฮไลต์วันนี้</h2><span class="hi" id="obs" style="color:var(--muted);font-size:13px"></span></div>
        <div class="hl-grid" id="hl"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>จังหวัดอื่น ๆ</h2>
          <div class="ctrl">
            <select id="region" aria-label="ภาค">
              <option value="">ทุกภาค</option><option value="north">ภาคเหนือ</option><option value="northeast">ภาคอีสาน</option>
              <option value="central">ภาคกลาง</option><option value="east">ภาคตะวันออก</option><option value="south">ภาคใต้</option>
            </select>
            <select id="sort" aria-label="เรียงตาม">
              <option value="temp_desc">ร้อนสุด</option><option value="temp_asc">เย็นสุด</option>
              <option value="rain_desc">ฝนมากสุด</option><option value="name">ชื่อ ก–ฮ</option>
            </select>
          </div>
        </div>
        <div class="plist" id="plist"></div>
      </section>

      <section class="card" id="forecast">
        <div class="card-head"><h2>พยากรณ์ 10 วัน</h2><span id="fc-name" style="color:var(--muted);font-size:13px"></span></div>
        <div class="days" id="days"></div>
      </section>

      <section class="card full" id="mapcard">
        <div class="card-head">
          <h2>แผนที่ 77 จังหวัด</h2>
          <div class="seg" role="group" aria-label="ค่าที่แสดงบนแผนที่">
            <button data-metric="temp" class="on">อุณหภูมิ</button><button data-metric="rain">โอกาสฝน</button><button data-metric="uv">UV</button>
          </div>
        </div>
        <div id="map"></div>
      </section>

      <section class="card full" id="tablecard">
        <div class="card-head">
          <h2>ตารางทุกจังหวัด</h2>
          <div class="tbl-ctrl"><input id="tq" type="search" placeholder="กรองตาราง…" aria-label="กรองตาราง"></div>
        </div>
        <div class="tbl-wrap" id="table"></div>
      </section>
    </div>

    <footer id="about">
      <div id="updated"></div>
      ข้อมูลสภาพอากาศจาก <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) ·
      ค่าที่แสดงเป็นจุดตัวเมืองของแต่ละจังหวัด · อัปเดตอัตโนมัติทุกชั่วโมง ·
      ดาวน์โหลด <a href="provinces_weather.json">JSON</a> / <a href="provinces_weather.geojson">GeoJSON</a>
    </footer>
  </main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-logo" viewBox="0 0 64 64">
    <circle cx="26" cy="24" r="12" fill="url(#gSun)"/>
    <g fill="url(#gCloud)" filter="url(#fSoft)"><circle cx="26" cy="38" r="9"/><circle cx="37" cy="32" r="12"/><circle cx="47" cy="40" r="8"/><rect x="18" y="38" width="37" height="10" rx="5"/></g>
  </symbol>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA_URLS = [
  "provinces_weather.json",
  "https://raw.githubusercontent.com/nawakonnakhonchai-wq/WeatherForecastDaily/main/provinces_weather.json"
];
const REGION_TH = { north: "ภาคเหนือ", northeast: "ภาคตะวันออกเฉียงเหนือ", central: "ภาคกลาง", east: "ภาคตะวันออก", south: "ภาคใต้" };
const DOW = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
const DOW_FULL = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
const MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- ไอคอนสภาพอากาศ (SVG) ---------- */
const P = {
  sun: (cx, cy, r) => `<g><g stroke="#fcc419" stroke-width="${r * .22}" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => {
      const t = a * Math.PI / 180, r1 = r * 1.38, r2 = r * 1.75;
      return `<line x1="${cx + Math.cos(t) * r1}" y1="${cy + Math.sin(t) * r1}" x2="${cx + Math.cos(t) * r2}" y2="${cy + Math.sin(t) * r2}"/>`;
    }).join("")}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gSun)"/></g>`,
  moon: (cx, cy, r) => `<path d="M${cx + r * .35} ${cy - r} a${r} ${r} 0 1 0 ${r * .65} ${r * 1.45} a${r * .8} ${r * .8} 0 0 1 ${-r * .65} ${-r * 1.45}z" fill="url(#gMoon)" filter="url(#fSoft)"/>`,
  cloud: (dx = 0, dy = 0, s = 1, fill = "gCloud") => `<g transform="translate(${dx} ${dy}) scale(${s})" fill="url(#${fill})" filter="url(#fSoft)"><circle cx="22" cy="36" r="9"/><circle cx="33" cy="29" r="12.5"/><circle cx="44" cy="37" r="8.5"/><rect x="13" y="36" width="40" height="11" rx="5.5"/></g>`,
  drops: (n = 3) => `<g fill="url(#gDrop)">${[[22, 51], [32, 53], [42, 51], [27, 59], [37, 60]].slice(0, n).map(([x, y]) => `<path d="M${x} ${y}c-1.6 2.4-2.4 3.7-2.4 4.8a2.4 2.4 0 0 0 4.8 0c0-1.1-.8-2.4-2.4-4.8z"/>`).join("")}</g>`,
  dots: () => `<g fill="#6cb6ff">${[[22, 53], [30, 56], [38, 53], [46, 56], [26, 60], [34, 61], [42, 60]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.5"/>`).join("")}</g>`,
  snow: () => `<g fill="#ffffff" stroke="#9fb3c8" stroke-width=".6">${[[22, 53], [32, 56], [42, 53], [27, 60], [37, 61]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.1"/>`).join("")}</g>`,
  bolt: () => `<path d="M34 44 26 56h6l-3 8 10-13h-6l3-7z" fill="url(#gBolt)" stroke="#e67700" stroke-width=".6" stroke-linejoin="round"/>`,
  fog: () => `<g stroke="#aeb8c6" stroke-width="2.6" stroke-linecap="round"><path d="M14 52h30M20 57h32M12 62h24"/></g>`,
};
function wxIcon(code, isDay = 1, cls = "") {
  const day = isDay !== 0;
  const orb = (cx, cy, r) => day ? P.sun(cx, cy, r) : P.moon(cx, cy, r);
  let g;
  if (code == null) g = P.cloud();
  else if (code === 0) g = day ? P.sun(32, 32, 13) : P.moon(32, 32, 15);
  else if (code === 1) g = orb(28, 27, 12) + P.cloud(14, 10, .72);
  else if (code === 2) g = orb(23, 22, 10) + P.cloud(2, 4);
  else if (code === 3) g = P.cloud(-6, -6, .85, "gCloudBack") + P.cloud(2, 4);
  else if (code <= 48) g = P.cloud(0, -4) + P.fog();
  else if (code <= 57) g = P.cloud(0, -6) + P.dots();
  else if (code <= 67) g = P.cloud(0, -8, 1, "gCloudDark") + P.drops(code >= 63 ? 5 : 3);
  else if (code <= 77) g = P.cloud(0, -8) + P.snow();
  else if (code <= 82) g = orb(22, 16, 9) + P.cloud(0, -6, 1, code === 80 ? "gCloud" : "gCloudDark") + P.drops(code >= 81 ? 5 : 3);
  else if (code <= 86) g = P.cloud(0, -8) + P.snow();
  else g = P.cloud(0, -8, 1, "gCloudDark") + P.drops(2) + P.bolt();
  return `<svg class="${cls}" viewBox="0 0 64 64" aria-hidden="true">${g}</svg>`;
}
function sunIcon(rise) {
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${P.sun(32, 34, 11)}
    <rect x="6" y="40" width="52" height="24" fill="var(--tile)"/>
    <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round"><path d="M10 42h44M16 48h32M22 54h20"/></g>
    <path d="${rise ? "M32 29v-8m-4 4 4-4 4 4" : "M32 21v8m-4-4 4 4 4-4"}" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---------- ตัวช่วย ---------- */
let UNIT = store.get("wx-unit") === "F" ? "F" : "C";
const conv = t => UNIT === "F" ? t * 9 / 5 + 32 : t;
const T = (t, d = 0) => t == null ? "–" : conv(t).toFixed(d) + "°";
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toFixed(d);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// อ่านวันที่จากสตริงเวลาไทยโดยตรง ไม่ขึ้นกับ timezone ของเครื่องผู้ชม
function parts(iso) { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return { y, m, d, dow: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; }
const thaiDate = iso => { const p = parts(iso); return `${p.d} ${MON[p.m - 1]} ${p.y + 543}`; };
const hhmm = iso => iso ? iso.slice(11, 16) : "–";

const TEMP_STOPS = [[18, "#2c7bb6"], [22, "#4aa3c8"], [26, "#5bb37a"], [29, "#e0b400"], [32, "#f07d1a"], [35, "#d7301f"], [Infinity, "#99000d"]];
const RAIN_STOPS = [[10, "#9aa5b1"], [30, "#9ecae1"], [50, "#4292c6"], [70, "#2171b5"], [Infinity, "#08306b"]];
const UV_STOPS = [[3, "#4caf50"], [6, "#fbc02d"], [8, "#f57c00"], [11, "#d32f2f"], [Infinity, "#7b1fa2"]];
const pick = (stops, v) => v == null ? "#8a96a3" : stops.find(([lim]) => v < lim)[1];
const uvText = v => v == null ? "–" : v < 3 ? "ต่ำ" : v < 6 ? "ปานกลาง" : v < 8 ? "สูง" : v < 11 ? "สูงมาก" : "อันตราย";
const humText = v => v == null ? "–" : v < 30 ? "อากาศแห้ง" : v < 60 ? "กำลังสบาย" : v < 80 ? "ค่อนข้างชื้น" : "ชื้นมาก";
const visText = km => km == null ? "–" : km >= 10 ? "ทัศนวิสัยดีมาก" : km >= 5 ? "ทัศนวิสัยดี" : km >= 2 ? "ปานกลาง" : "ต่ำ (หมอก/ฝน)";
const DIRS = ["เหนือ", "ตะวันออกเฉียงเหนือ", "ตะวันออก", "ตะวันออกเฉียงใต้", "ใต้", "ตะวันตกเฉียงใต้", "ตะวันตก", "ตะวันตกเฉียงเหนือ"];
const dirText = d => d == null ? "–" : "ลมจากทิศ" + DIRS[Math.round(d / 45) % 8];
const today = p => p.daily[0] || {};

/* ---------- สถานะ ---------- */
let DATA = null, SEL = null, METRIC = "temp";
const markers = {};

async function loadData() {
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url + "?v=" + Math.floor(Date.now() / 600000), { cache: "no-cache" });
      if (res.ok) return await res.json();
    } catch (e) { /* ลอง URL ถัดไป */ }
  }
  throw new Error("โหลดข้อมูลไม่ได้");
}

/* ---------- การ์ดหลัก ---------- */
function renderNow() {
  const p = SEL, c = p.current, t0 = today(p), d = parts(c.time || t0.date);
  document.getElementById("nowcard").innerHTML = `
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>${esc(p.name_th)} · ${esc(REGION_TH[p.region])}</div>
    <div class="rain" title="โอกาสฝนวันนี้">☔ ${fmt(t0.rain_prob)}%</div>
    <div>
      <div class="day">${DOW_FULL[d.dow]}</div>
      <div class="date">${thaiDate(c.time || t0.date)} · ข้อมูลเวลา ${hhmm(c.time)} น.</div>
      ${wxIcon(c.weather_code, c.is_day, "big-ic")}
    </div>
    <div class="right">
      <div class="temp">${T(c.temp)}${UNIT}</div>
      <div class="minmax">${T(t0.temp_max)} / ${T(t0.temp_min)}</div>
    </div>
    <div class="left-bottom" style="color:var(--muted);font-size:13px">ฝนวันนี้ ${fmt(t0.rain_mm, 1)} มม.</div>
    <div class="desc"><b>${esc(c.weather_th || "–")}</b><span>รู้สึกเหมือน ${T(c.feels_like)}</span></div>`;
}

/* ---------- ไฮไลต์ ---------- */
function renderHighlights() {
  const p = SEL, c = p.current, t0 = today(p);
  const vis = c.visibility_m == null ? null : c.visibility_m / 1000;
  const ic = {
    wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg>',
    hum: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s-6 6.6-6 11a6 6 0 0 0 12 0c0-4.4-6-11-6-11z"/></svg>',
    uv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="4"/><path d="M12 4v2M4.9 7l1.4 1.4M19.1 7l-1.4 1.4M2 14h2M20 14h2M3 20h18"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  };
  document.getElementById("obs").textContent = c.time ? `ข้อมูล ณ ${hhmm(c.time)} น.` : "";
  document.getElementById("hl").innerHTML = `
    <div class="tile"><div class="k">${ic.wind}ลม</div>
      <div class="v">${fmt(c.wind_kmh, 1)}<small>กม./ชม.</small>
        ${c.wind_dir == null ? "" : `<svg class="wind-arrow" viewBox="0 0 24 24" style="transform:rotate(${c.wind_dir + 180}deg)" fill="currentColor"><path d="M12 2 7 12h3.5v10h3V12H17z"/></svg>`}</div>
      <div class="s">${dirText(c.wind_dir)}</div></div>
    <div class="tile"><div class="k">${ic.hum}ความชื้น</div>
      <div class="v">${fmt(c.humidity)}<small>%</small></div><div class="s">${humText(c.humidity)}</div></div>
    <div class="tile sun sun-rise">${sunIcon(true)}<div><div class="k">พระอาทิตย์ขึ้น</div><div class="v">${hhmm(t0.sunrise)}</div></div></div>
    <div class="tile"><div class="k">${ic.uv}ดัชนี UV สูงสุด</div>
      <div class="v" style="color:${pick(UV_STOPS, t0.uv_max)}">${fmt(t0.uv_max, 1)}<small>UV</small></div><div class="s">${uvText(t0.uv_max)}</div></div>
    <div class="tile"><div class="k">${ic.eye}ทัศนวิสัย</div>
      <div class="v">${vis == null ? "–" : fmt(vis, vis < 10 ? 1 : 0)}<small>กม.</small></div><div class="s">${visText(vis)}</div></div>
    <div class="tile sun sun-set">${sunIcon(false)}<div><div class="k">พระอาทิตย์ตก</div><div class="v">${hhmm(t0.sunset)}</div></div></div>`;
}

/* ---------- พยากรณ์รายวัน ---------- */
function renderDays() {
  document.getElementById("fc-name").textContent = SEL.name_th;
  document.getElementById("days").innerHTML = SEL.daily.map((d, i) => {
    const p = parts(d.date);
    const label = i === 0 ? "วันนี้" : i === 1 ? "พรุ่งนี้" : DOW[p.dow];
    return `<div class="dcard ${i === 0 ? "today" : ""}" title="${esc(d.weather_th)}">
      <div class="dn">${label}</div><div class="dd">${p.d} ${MON[p.m - 1]}</div><div class="bar"></div>
      ${wxIcon(d.weather_code, 1)}
      <div class="mx">${T(d.temp_max)}</div><div class="mn">${T(d.temp_min)}</div>
      <div class="rp">☔ ${fmt(d.rain_prob)}%</div></div>`;
  }).join("");
}

/* ---------- รายการจังหวัด ---------- */
const SORTS = {
  name: (a, b) => a.name_th.localeCompare(b.name_th, "th"),
  temp_desc: (a, b) => (b.current.temp ?? -99) - (a.current.temp ?? -99),
  temp_asc: (a, b) => (a.current.temp ?? 99) - (b.current.temp ?? 99),
  rain_desc: (a, b) => (today(b).rain_prob ?? -1) - (today(a).rain_prob ?? -1),
};
function renderList() {
  const region = document.getElementById("region").value;
  const rows = DATA.provinces.filter(p => !region || p.region === region).sort(SORTS[document.getElementById("sort").value]);
  document.getElementById("plist").innerHTML = rows.map(p => `
    <button class="pitem ${p === SEL ? "on" : ""}" data-id="${p.id}">
      <div><div class="rg">${esc(REGION_TH[p.region])}</div><div class="nm">${esc(p.name_th)}</div><div class="ds">${esc(p.current.weather_th || "–")}</div></div>
      ${wxIcon(p.current.weather_code, p.current.is_day)}
      <div class="tp">${T(p.current.temp)}<small>/${T(today(p).temp_min)}</small></div>
    </button>`).join("");
}

/* ---------- ตาราง ---------- */
let TSORT = { key: "name", dir: 1 };
const TCOLS = [
  ["name", "จังหวัด", p => p.name_th, ""],
  ["wx", "อากาศ", p => p.current.weather_th, ""],
  ["temp", "อุณหภูมิ", p => p.current.temp, "num"],
  ["hi", "สูงสุด", p => today(p).temp_max, "num hide-sm"],
  ["lo", "ต่ำสุด", p => today(p).temp_min, "num hide-sm"],
  ["rain", "ฝน %", p => today(p).rain_prob, "num"],
  ["hum", "ความชื้น", p => p.current.humidity, "num hide-sm"],
  ["uv", "UV", p => today(p).uv_max, "num hide-sm"],
];
function renderTable() {
  const q = document.getElementById("tq").value.trim().toLowerCase();
  const col = TCOLS.find(c => c[0] === TSORT.key);
  const rows = DATA.provinces.filter(p => !q || p.name_th.includes(q) || p.name_en.toLowerCase().includes(q) || (REGION_TH[p.region] || "").includes(q))
    .sort((a, b) => {
      const x = col[2](a), y = col[2](b);
      if (typeof x === "string" || typeof y === "string") return String(x ?? "").localeCompare(String(y ?? ""), "th") * TSORT.dir;
      return ((x ?? -1e9) - (y ?? -1e9)) * TSORT.dir;
    });
  const arrow = k => TSORT.key === k ? (TSORT.dir > 0 ? " ▲" : " ▼") : "";
  document.getElementById("table").innerHTML = rows.length ? `<table>
    <thead><tr>${TCOLS.map(([k, label, , cls]) => `<th class="${cls}" data-k="${k}">${label}${arrow(k)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(p => { const t0 = today(p), c = p.current; return `<tr data-id="${p.id}" class="${p === SEL ? "on" : ""}">
      <td>${esc(p.name_th)}</td>
      <td title="${esc(c.weather_th || "")}">${wxIcon(c.weather_code, c.is_day, "ic")}<span class="wxt">${esc(c.weather_th || "–")}</span></td>
      <td class="num"><span class="badge" style="background:${pick(TEMP_STOPS, c.temp)}">${T(c.temp, 1)}</span></td>
      <td class="num hide-sm">${T(t0.temp_max)}</td><td class="num hide-sm">${T(t0.temp_min)}</td>
      <td class="num">${fmt(t0.rain_prob)}%</td><td class="num hide-sm">${fmt(c.humidity)}%</td>
      <td class="num hide-sm">${fmt(t0.uv_max, 1)}</td></tr>`; }).join("")}</tbody></table>` : '<div class="msg">ไม่พบจังหวัด</div>';
}

/* ---------- แผนที่ ---------- */
const map = L.map("map", { zoomControl: true, scrollWheelZoom: false, zoomSnap: 0.5 }).setView([13.2, 100.9], 6);
// แผนที่ฐานโทนเทาของ Esri (ไม่ต้องใช้ API key) — ชั้นพื้น + ชั้นชื่อสถานที่ สลับตามธีม
let tiles = [];
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
function setTiles() {
  const tone = document.documentElement.dataset.theme === "light" ? "Light" : "Dark";
  tiles.forEach(t => t.remove());
  const opt = { maxZoom: 12, maxNativeZoom: 16 };
  tiles = [
    L.tileLayer(`${ESRI}World_${tone}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
      ...opt, attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Weather: <a href="https://open-meteo.com/">Open-Meteo</a>'
    }),
    L.tileLayer(`${ESRI}World_${tone}_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { ...opt, pane: "overlayPane" }),
  ];
  tiles.forEach(t => t.addTo(map));
  tiles[1].bringToBack();
}
setTiles();
const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => L.DomUtil.create("div", "legend");
legend.addTo(map);
const METRICS = {
  temp: { title: "อุณหภูมิ", stops: TEMP_STOPS, val: p => p.current.temp,
    labels: () => ["< 18", "18–22", "22–26", "26–29", "29–32", "32–35", "≥ 35"].map((l, i) => UNIT === "C" ? l + "°C" : ["< 64", "64–72", "72–79", "79–84", "84–90", "90–95", "≥ 95"][i] + "°F") },
  rain: { title: "โอกาสฝนวันนี้", stops: RAIN_STOPS, val: p => today(p).rain_prob, labels: () => ["< 10%", "10–30%", "30–50%", "50–70%", "≥ 70%"] },
  uv: { title: "ดัชนี UV สูงสุด", stops: UV_STOPS, val: p => today(p).uv_max, labels: () => ["0–2 ต่ำ", "3–5 ปานกลาง", "6–7 สูง", "8–10 สูงมาก", "11+ อันตราย"] },
};
function renderMap() {
  const m = METRICS[METRIC], labels = m.labels();
  legend.getContainer().innerHTML = `<b>${m.title}</b><br>` + m.stops.map(([, c], i) => `<i style="background:${c}"></i>${labels[i]}`).join("<br>");
  for (const p of DATA.provinces) {
    const mk = markers[p.id];
    mk.setStyle({ fillColor: pick(m.stops, m.val(p)), radius: p === SEL ? 11 : 8, weight: p === SEL ? 3 : 1.5, color: p === SEL ? "#fbbf24" : "#ffffff" });
    mk.setTooltipContent(`<b>${esc(p.name_th)}</b><br>${T(p.current.temp, 1)}${UNIT} · ${esc(p.current.weather_th || "")}<br>โอกาสฝนวันนี้ ${fmt(today(p).rain_prob)}% · UV ${fmt(today(p).uv_max, 1)}`);
  }
}

/* ---------- เลือกจังหวัด ---------- */
function select(id, opts = {}) {
  const p = DATA.provinces.find(x => x.id === id);
  if (!p) return;
  SEL = p;
  store.set("wx-province", id);
  if (opts.hash) history.replaceState(null, "", "#" + id);
  renderAll();
  if (opts.fly) map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 8), { duration: .6 });
  if (opts.top) document.getElementById("overview").scrollIntoView({ behavior: "smooth" });
}
function renderAll() { renderNow(); renderHighlights(); renderDays(); renderList(); renderTable(); renderMap(); }

/* ---------- ค้นหา ---------- */
const q = document.getElementById("q"), sugg = document.getElementById("sugg");
let hlIdx = 0, matches = [];
function showSugg() {
  const s = q.value.trim().toLowerCase();
  matches = s ? DATA.provinces.filter(p => p.name_th.includes(s) || p.name_en.toLowerCase().includes(s)).slice(0, 8) : [];
  hlIdx = 0;
  sugg.innerHTML = matches.length ? matches.map((p, i) => `<button data-id="${p.id}" class="${i === 0 ? "hl" : ""}"><span>${esc(p.name_th)} <small>${esc(p.name_en)}</small></span><small>${T(p.current.temp)}</small></button>`).join("")
    : s ? '<div class="msg" style="padding:12px">ไม่พบจังหวัด</div>' : "";
  sugg.classList.toggle("show", !!s);
}
function pickSugg(id) { q.value = ""; sugg.classList.remove("show"); select(id, { fly: true, hash: true }); q.blur(); }
q.addEventListener("input", showSugg);
q.addEventListener("keydown", e => {
  if (!matches.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); hlIdx = (hlIdx + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
    [...sugg.children].forEach((b, i) => b.classList.toggle("hl", i === hlIdx));
  } else if (e.key === "Enter") { e.preventDefault(); pickSugg(matches[hlIdx].id); }
  else if (e.key === "Escape") sugg.classList.remove("show");
});
sugg.addEventListener("mousedown", e => { const b = e.target.closest("button[data-id]"); if (b) { e.preventDefault(); pickSugg(b.dataset.id); } });
q.addEventListener("blur", () => setTimeout(() => sugg.classList.remove("show"), 120));

/* ---------- ปุ่มต่าง ๆ ---------- */
function syncSeg(attr, val) { document.querySelectorAll(`[${attr}]`).forEach(b => b.classList.toggle("on", b.getAttribute(attr) === val)); }
document.querySelectorAll("[data-unit]").forEach(b => b.addEventListener("click", () => {
  UNIT = b.dataset.unit; store.set("wx-unit", UNIT); syncSeg("data-unit", UNIT); if (DATA) renderAll();
}));
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn; store.set("wx-theme", b.dataset.themeBtn);
  syncSeg("data-theme-btn", b.dataset.themeBtn); setTiles();
}));
document.querySelectorAll("[data-metric]").forEach(b => b.addEventListener("click", () => {
  METRIC = b.dataset.metric; syncSeg("data-metric", METRIC); if (DATA) renderMap();
}));
syncSeg("data-unit", UNIT);
syncSeg("data-theme-btn", document.documentElement.dataset.theme);
document.getElementById("region").addEventListener("change", renderList);
document.getElementById("sort").addEventListener("change", renderList);
document.getElementById("tq").addEventListener("input", renderTable);
document.getElementById("plist").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) select(b.dataset.id, { fly: true, hash: true, top: innerWidth <= 1180 }); });
document.getElementById("table").addEventListener("click", e => {
  const th = e.target.closest("th[data-k]");
  if (th) { TSORT = { key: th.dataset.k, dir: TSORT.key === th.dataset.k ? -TSORT.dir : (["name", "wx"].includes(th.dataset.k) ? 1 : -1) }; renderTable(); return; }
  const tr = e.target.closest("tr[data-id]"); if (tr) select(tr.dataset.id, { fly: true, hash: true, top: true });
});

// ไฮไลต์เมนูตามส่วนที่กำลังดู
const navLinks = [...document.querySelectorAll(".nav a")];
const SECTIONS = ["overview", "forecast", "mapcard", "tablecard", "about"].map(id => document.getElementById(id));
function syncNav() {
  let cur = SECTIONS[0];
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  if (atBottom) cur = SECTIONS[SECTIONS.length - 1];
  else for (const sec of SECTIONS) if (sec.getBoundingClientRect().top <= innerHeight * 0.35) cur = sec;
  navLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur.id));
}
addEventListener("scroll", syncNav, { passive: true });
syncNav();

function greet() {
  const h = Number(new Intl.DateTimeFormat("en-GB", { hour: "numeric", hour12: false, timeZone: "Asia/Bangkok" }).format(new Date()));
  document.getElementById("greet").textContent = h >= 5 && h < 12 ? "สวัสดีตอนเช้า ☀️" : h < 17 && h >= 12 ? "สวัสดีตอนบ่าย 🌤️" : h >= 17 && h < 20 ? "สวัสดีตอนเย็น 🌇" : "สวัสดีตอนค่ำ 🌙";
}
greet();

loadData().then(data => {
  DATA = data;
  const u = data.updated_at;
  document.getElementById("updated").textContent = `อัปเดตล่าสุด ${thaiDate(u)} เวลา ${u.slice(11, 16)} น.`;
  for (const p of data.provinces) {
    markers[p.id] = L.circleMarker([p.lat, p.lon], { radius: 8, weight: 1.5, color: "#fff", fillOpacity: .95 })
      .bindTooltip("", { direction: "top", offset: [0, -6] })
      .on("click", () => select(p.id))
      .addTo(map);
  }
  map.fitBounds(L.latLngBounds(data.provinces.map(p => [p.lat, p.lon])), { padding: [20, 20] });
  const fromHash = location.hash.slice(1).toUpperCase();
  const start = [fromHash, store.get("wx-province"), "BKK"].find(id => id && data.provinces.some(p => p.id === id));
  select(start);
}).catch(err => {
  console.error(err);
  document.getElementById("nowcard").innerHTML = '<div class="msg">ยังไม่มีข้อมูล — รัน workflow “Update Open-Meteo 77 Provinces” ในแท็บ Actions แล้วเปิดหน้านี้ใหม่</div>';
});
</script>
