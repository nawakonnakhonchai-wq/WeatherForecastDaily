name: Update Open-Meteo 77 Provinces

on:
  schedule:
    # ทุกชั่วโมงที่นาทีที่ 17 (UTC) — 77 จุด x 24 ครั้ง ≈ 1,850 calls/วัน อยู่ในโควตาฟรี 10,000/วัน
    - cron: '17 * * * *'
  workflow_dispatch:

# ใช้กลุ่มเดียวกับ weather_update.yml เพื่อไม่ให้สอง workflow push ชนกัน
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch 77 provinces from Open-Meteo
        run: python scripts/update_openmeteo.py

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add provinces_weather.json provinces_weather.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Open-Meteo 77 provinces: $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
